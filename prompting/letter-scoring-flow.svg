<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 180" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Letter scoring procedure</title>
  <desc id="desc">Start with five points. Inspect the letter against the checklist, counting each missing non-optional field separately and each other listed issue once. Subtract the penalty count, with a minimum score of zero, and return LetterInfo.score.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker>
  </defs>
  <g stroke-width="3">
    <rect x="10" y="20" width="245" height="140" rx="18" fill="#E8EFFB" stroke="#176AB4"/>
    <rect x="320" y="20" width="660" height="140" rx="18" fill="#F0EAF8" stroke="#7145AD"/>
    <rect x="1045" y="20" width="390" height="140" rx="18" fill="#FFF3DC" stroke="#A76508"/>
    <rect x="1500" y="20" width="290" height="140" rx="18" fill="#E7F3EC" stroke="#18754D"/>
    <g stroke="#475569" marker-end="url(#arrow)"><path d="M262 90h48"/><path d="M987 90h48"/><path d="M1442 90h48"/></g>
  </g>
  <g text-anchor="middle" fill="#17243B">
    <g font-size="29" font-weight="bold">
      <text x="132" y="71" fill="#176AB4">Start at 5</text>
      <text x="650" y="61" fill="#7145AD">Inspect letter → count penalties N</text>
      <text x="1240" y="71" fill="#A76508">Subtract; floor at 0</text>
      <text x="1645" y="71" fill="#18754D">Return score</text>
    </g>
    <g font-size="25">
      <text x="132" y="113">Maximum score</text>
      <text x="650" y="101">-1 per missing non-optional field</text>
      <text x="650" y="135">-1 per any other listed problem</text>
      <text x="1240" y="113" font-family="monospace">max(0, 5 − N)</text>
      <text x="1645" y="113" font-family="monospace">LetterInfo.score</text>
    </g>
  </g>
</svg>
