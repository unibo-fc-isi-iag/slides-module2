<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 670" font-family="Signika Negative, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#222">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="600" y="20" width="400" height="100" rx="12" fill="#555" fill-opacity="0.12" stroke="#555" stroke-width="3"/>
<text x="800" y="62" font-size="24" font-weight="600">Human</text>
<text x="800" y="94" font-size="18" fill="#555">delegates a goal, and remains responsible for it</text>
<rect x="80" y="170" width="1440" height="250" rx="12" fill="#3a9a5b" fill-opacity="0.06" stroke="#3a9a5b" stroke-width="3" stroke-dasharray="12,6"/>
<text x="110" y="205" font-size="28" font-weight="600" fill="#3a9a5b" text-anchor="start">Agent</text>
<rect x="140" y="240" width="270" height="140" rx="12" fill="#e7a626" fill-opacity="0.15" stroke="#e7a626" stroke-width="3"/>
<text x="275" y="290" font-size="25" font-weight="600">sensors</text>
<text x="275" y="326" font-size="19" >perceive</text>
<text x="275" y="352" font-size="19" >get information</text>
<rect x="490" y="240" width="270" height="140" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
<text x="625" y="290" font-size="25" font-weight="600">beliefs</text>
<text x="625" y="326" font-size="19" >(internal) representation</text>
<text x="625" y="352" font-size="19" >of the world</text>
<rect x="840" y="240" width="270" height="140" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
<text x="975" y="290" font-size="25" font-weight="600">deliberation</text>
<text x="975" y="326" font-size="19" >what to do now,</text>
<text x="975" y="352" font-size="19" >given the goal?</text>
<rect x="1190" y="240" width="270" height="140" rx="12" fill="#e7a626" fill-opacity="0.15" stroke="#e7a626" stroke-width="3"/>
<text x="1325" y="290" font-size="25" font-weight="600">actuators</text>
<text x="1325" y="326" font-size="19" >act</text>
<text x="1325" y="352" font-size="19" >change the environment</text>
<line x1="410" y1="310" x2="486" y2="310" stroke="#555" stroke-width="3" marker-end="url(#a)" />
<line x1="760" y1="310" x2="836" y2="310" stroke="#555" stroke-width="3" marker-end="url(#a)" />
<line x1="1110" y1="310" x2="1186" y2="310" stroke="#555" stroke-width="3" marker-end="url(#a)" />
<line x1="975" y1="120" x2="975" y2="236" stroke="#555" stroke-width="3" marker-end="url(#a)" />
<text x="990" y="160" font-size="19" font-style="italic" fill="#555" text-anchor="start">goal</text>
<rect x="80" y="500" width="1440" height="150" rx="12" fill="#7e57c2" fill-opacity="0.12" stroke="#7e57c2" stroke-width="3"/>
<text x="800" y="545" font-size="28" font-weight="600" fill="#7e57c2">Environment</text>
<text x="800" y="583" font-size="19" >physical, digital, or organisational: it also changes independently of the agent (people, other agents)</text>
<text x="800" y="619" font-size="19" font-style="italic" fill="#555">the agent is situated: it only sees part of it, and only through its own sensors</text>
<line x1="275" y1="500" x2="275" y2="384" stroke="#555" stroke-width="3" marker-end="url(#a)" />
<text x="290" y="455" font-size="20" font-style="italic" fill="#555" text-anchor="start">percepts</text>
<line x1="1325" y1="380" x2="1325" y2="496" stroke="#555" stroke-width="3" marker-end="url(#a)" />
<text x="1310" y="455" font-size="20" font-style="italic" fill="#555" text-anchor="end">actions</text>
</svg>
