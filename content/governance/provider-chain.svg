<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1810 295" width="1810" height="295" font-family="'Signika Negative', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#222222" text-anchor="middle">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="30" width="1310" height="44" rx="10" fill="#fdecea" stroke="#d64541" stroke-width="2"/>
<text x="675" y="61" font-size="24" fill="#a3302c" font-weight="bold">data (e.g. the candidates' applications) flow through here</text>
<rect x="1400" y="30" width="390" height="44" rx="10" fill="#eef7ee" stroke="#3a9e4f" stroke-width="2"/>
<text x="1595" y="61" font-size="24" fill="#2d7a3d" font-weight="bold">does not see the data</text>
<rect x="20" y="100" width="390" height="130" rx="14" fill="#eeeeee" stroke="#555555" stroke-width="3"/>
<text x="215" y="150" font-size="28" font-weight="bold">organisation</text><text x="215" y="192" font-size="22" font-style="italic">e.g. the university</text>
<text x="215" y="275" font-size="22" fill="#555">data controller</text>
<rect x="480" y="100" width="390" height="130" rx="14" fill="#d6e8fb" stroke="#2690e7" stroke-width="3"/>
<text x="675" y="150" font-size="28" font-weight="bold">aggregator</text><text x="675" y="192" font-size="22" font-style="italic">e.g. Open Router (USA)</text>
<text x="675" y="275" font-size="22" fill="#555">ToS + DPA signed by you</text>
<rect x="940" y="100" width="390" height="130" rx="14" fill="#fbe7cf" stroke="#e8871e" stroke-width="3"/>
<text x="1135" y="150" font-size="28" font-weight="bold">inference provider</text><text x="1135" y="192" font-size="22" font-style="italic">e.g. Together AI (USA), Scaleway (EU)</text>
<text x="1135" y="275" font-size="22" fill="#555">contract with the aggregator</text>
