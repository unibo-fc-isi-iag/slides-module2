<text x="1595" y="150" font-size="28" font-weight="bold">model developer</text><text x="1595" y="192" font-size="22" font-style="italic">e.g. Qwen3 (Alibaba, China)</text>
<text x="1595" y="275" font-size="22" fill="#555">only the weights' license</text>
<line x1="414" y1="165" x2="476" y2="165" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
